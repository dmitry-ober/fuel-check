<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FUEL CHECK — SR22T</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <h1 class="ph-title">FUEL CHECK — SR22T <span id="utc-clock" aria-label="Current UTC time"></span></h1>

  <div class="row">
    <label class="field"><span class="lab">Fuel on board</span>
      <span class="valwrap"><input id="fob" type="text" inputmode="decimal" autocomplete="off"><span class="unit">gal</span></span></label>
    <label class="field"><span class="lab">Fuel flow</span>
      <span class="valwrap"><input id="ff" type="text" inputmode="decimal" autocomplete="off"><span class="unit">gph</span></span></label>
  </div>

  <div class="row">
    <label class="field"><span class="lab">Dist to dest</span>
      <span class="valwrap"><input id="dist" type="text" inputmode="decimal" autocomplete="off"><span class="unit">nm</span></span></label>
    <label class="field gps"><span class="lab">GS <button type="button" id="gps-badge" class="gpsbadge" title="GPS live: ground speed auto-fills" aria-label="GPS live: ground speed auto-fills">GPS</button></span>
      <span class="valwrap"><input id="gs" type="text" inputmode="decimal" autocomplete="off"><span class="unit">kt</span></span></label>
    <label class="field"><span class="lab">TAS</span>
      <span class="valwrap"><input id="tas" type="text" inputmode="decimal" autocomplete="off"><span class="unit">kt</span></span></label>
  </div>

  <div class="row">
    <label class="field"><span class="lab">Garmin FOD</span>
      <span class="valwrap"><input id="garmin-fod" type="text" inputmode="decimal" autocomplete="off" placeholder="optional"><span class="unit">gal</span></span></label>
  </div>

  <div class="tabs" role="tablist">
    <button type="button" id="tab-quick" class="tab on" role="tab" aria-selected="true">QUICK WIND</button>
    <button type="button" id="tab-precise" class="tab" role="tab" aria-selected="false">PRECISE WIND</button>
  </div>

  <div class="row precise-only">
    <label class="field"><span class="lab">Course (track)</span>
      <span class="valwrap"><input id="course" type="text" inputmode="numeric" autocomplete="off"><span class="unit">°</span></span></label>
    <label class="field"><span class="lab">Mag var <span id="magvar-src"></span></span>
      <span class="valwrap"><input id="mag-var" type="text" inputmode="decimal" autocomplete="off"><span class="unit">°</span>
        <span class="seg" role="group" aria-label="Variation direction"><button type="button" id="mv-w" class="segbtn on" aria-pressed="true">W</button><button type="button" id="mv-e" class="segbtn" aria-pressed="false">E</button></span></span></label>
  </div>

  <div class="youline"><span class="dot"></span><span class="txt" id="you-line">YOU · 0 NM</span><span class="cur">current wind in your GS</span></div>

  <div id="points"></div>

  <button type="button" id="add-point" class="addbtn">+ Add wind point</button>

  <section class="arrival">
    <button type="button" id="arr-toggle" class="arrhead" aria-expanded="false">
      <span class="lab">ARRIVAL — TOD &amp; approach</span><span class="arrstate" id="arr-state">OFF</span>
    </button>
    <div id="arr-body" hidden>
      <div class="row">
        <label class="field"><span class="lab">Cruise alt</span>
          <span class="valwrap"><input id="cr-alt" type="text" inputmode="numeric" autocomplete="off"><span class="unit">ft</span></span></label>
        <label class="field"><span class="lab">Field elev</span>
          <span class="valwrap"><input id="fld-elev" type="text" inputmode="numeric" autocomplete="off"><span class="unit">ft</span></span></label>
        <label class="field"><span class="lab">Descent</span>
          <span class="valwrap"><input id="desc-rate" type="text" inputmode="numeric" autocomplete="off"><span class="unit">fpm</span></span></label>
      </div>
      <div class="row">
        <label class="field"><span class="lab">Descent FF</span>
          <span class="valwrap"><input id="desc-ff" type="text" inputmode="decimal" autocomplete="off"><span class="unit">gph</span></span></label>
        <label class="field"><span class="lab">Approach FF</span>
          <span class="valwrap"><input id="appr-ff" type="text" inputmode="decimal" autocomplete="off"><span class="unit">gph</span></span></label>
      </div>
      <div class="row">
        <label class="field"><span class="lab">Approach / procedure time</span>
          <span class="valwrap"><input id="appr-min" type="text" inputmode="numeric" autocomplete="off"><span class="unit">min</span>
            <span class="seg" role="group" aria-label="Quick add minutes"><button type="button" class="segbtn" data-addmin="5">+5</button><button type="button" class="segbtn" data-addmin="10">+10</button><button type="button" class="segbtn" data-addmin="15">+15</button><button type="button" class="segbtn" data-addmin="0" aria-label="Reset to zero">0</button></span></span></label>
      </div>
      <div class="procrow">
        <select id="proc-sel" aria-label="Saved arrival procedures"><option value="">Saved procedures…</option></select>
        <button type="button" id="proc-use" class="segbtn">Use</button>
        <button type="button" id="proc-del" class="segbtn" aria-label="Delete selected procedure">×</button>
        <button type="button" id="proc-add" class="segbtn">+ New</button>
      </div>
      <div id="proc-form" class="procform" hidden>
        <div class="row">
          <label class="field"><span class="lab">Airport</span>
            <span class="valwrap"><input id="pf-apt" type="text" autocomplete="off" placeholder="FACT" maxlength="4"></span></label>
          <label class="field"><span class="lab">Procedure</span>
            <span class="valwrap"><input id="pf-name" type="text" autocomplete="off" placeholder="ILS 01 vectors S"></span></label>
          <label class="field"><span class="lab">Time</span>
            <span class="valwrap"><input id="pf-min" type="text" inputmode="numeric" autocomplete="off"><span class="unit">min</span></span></label>
        </div>
        <div class="procrow">
          <button type="button" id="pf-save" class="segbtn">Save</button>
          <button type="button" id="pf-cancel" class="segbtn">Cancel</button>
        </div>
      </div>
    </div>
  </section>

  <section id="result" class="result" aria-live="polite">
    <div class="cap">Fuel at destination</div>
    <div class="big" id="fod-big">—</div>
    <div class="sub" id="result-sub"></div>
    <div class="sub" id="arr-sub"></div>
    <div class="warn" id="result-warning" hidden></div>
  </section>

  <footer class="foot">Cross-check only — fly the Garmin.
    <div class="foot-update">
      <span id="app-version"></span>
      <button type="button" id="update-btn">Check for update</button>
    </div>
  </footer>
</main>

<template id="point-template">
  <div class="wp">
    <div class="wpnum"></div>
    <label class="cell"><span class="lab">Dist from you</span>
      <span class="inputbox"><input type="text" inputmode="decimal" autocomplete="off" data-field="dist"><span class="unit">nm</span></span></label>
    <label class="cell quick-only"><span class="lab">Wind from here</span>
      <span class="inputbox"><input type="text" inputmode="decimal" autocomplete="off" data-field="comp"><span class="unit">kt</span></span></label>
    <div class="seg quick-only" role="group" aria-label="Wind direction"><button type="button" class="segbtn on" data-wind="hw" aria-pressed="true">HW</button><button type="button" class="segbtn" data-wind="tw" aria-pressed="false">TW</button></div>
    <label class="cell precise-only"><span class="lab">Wind dir</span>
      <span class="inputbox"><input type="text" inputmode="numeric" autocomplete="off" data-field="windDir"><span class="unit">°</span></span></label>
    <label class="cell precise-only"><span class="lab">Wind spd</span>
      <span class="inputbox"><input type="text" inputmode="decimal" autocomplete="off" data-field="windSpeed"><span class="unit">kt</span></span></label>
    <div class="cell precise-only compbox"><span class="lab">Comp.</span><span class="val comp-out" data-readout="comp">—</span></div>
    <button type="button" class="rm" data-remove aria-label="Remove wind point">×</button>
  </div>
</template>
<script type="module" src="app.mjs"></script>
</body>
</html>
